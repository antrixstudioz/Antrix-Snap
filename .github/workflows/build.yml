name: Build Snap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            args: -A x64
          - os: macos-latest
            label: macOS-universal
            args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.args }}
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test sample playback and invisible hand target
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: Snap-UI-${{ matrix.label }}
          path: build/Snap-UI.png
          if-no-files-found: error
      - name: Package on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Snap_artefacts/Release/VST3/Snap.vst3 dist/Snap-macOS-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent build/Snap_artefacts/Release/AU/Snap.component dist/Snap-macOS-AU.zip
          ditto -c -k --sequesterRsrc --keepParent build/Snap_artefacts/Release/Standalone/Snap.app dist/Snap-macOS-Standalone.zip
      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Snap-macOS-universal
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Snap-Windows-x64
          path: |
            build/Snap_artefacts/Release/VST3/
            build/Snap_artefacts/Release/Standalone/
          if-no-files-found: error

